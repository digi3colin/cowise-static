.fstep .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.fstep .in{position:absolute;left:24px;right:24px;top:22px;bottom:24px;display:flex;flex-direction:column;gap:20px}

<script>
"use strict";
/* ============================================================
   COWISE IDEA LAB — E-form plugin
   Same grammar as intro/cms.html: everything is a pure function of the
   playhead (in beats), locked to a 128 BPM grid and scrubbable.

   CHAPTERS (beats · 4 beats = 1 bar = 1.875 s)
     00   0 – 16   intro ............ "Fill in. Sign off." + logo
     01  16 – 40   approval flow, first impression (form-flow-slide)
     02  40 – 60   the same flow in detail (form-flow-slide-detailed);
                   the steps then fold into the progress rail
     03  60 –172   live demo: one real request, screenshot by screenshot
     04 172 –192   outro
   ============================================================ */
const BPM = 128, SPB = 60 / BPM;             // 0.46875 s per beat
const END = 192;                         // authored beats (grows as chapters are added)
const DURATION = END * SPB;
const W = 1920, H = 1080;
const C = {pink:'#ff0062',cyan:'#7ce7f9',orange:'#fda602',yellow:'#ffde0b',navy:'#052675',green:'#7cf9bf',purple:'#a97cf9',blue:'#7c9ef9',gold:'#ffc93c',ink:'#0d0d10'};
const STRIPES = [C.pink, C.cyan, C.orange, C.yellow, C.navy];
const IMG = '/media/images/';
const DROPS = [16, 40, 60, 172, 180];

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (b, start, dur) => clamp((b - start) / dur);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);
const pulse = (b, k = 6) => b < 0 ? 0 : Math.exp(-frac(b) * k);
const E = {
  o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, o4: x => 1 - (1 - x) ** 4,
  i2: x => x * x, i3: x => x ** 3, i4: x => x ** 4,
  io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
