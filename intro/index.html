<script>
"use strict";
/* ============================================================
   COWISE IDEA LAB — Our Story
   Everything is a pure function of the playhead (in beats),
   so the picture is locked to the 128 BPM grid and scrubbable.
   ============================================================ */
const BPM = 128, SPB = 60 / BPM;             // 0.46875 s per beat
// The story was authored on a 148-beat timeline; one bar (story beats 44–48, the old Times Square
// slide) is cut, so real playback is 144 beats (36 bars = 67.5 s). Everything after the cut is
// authored in story beats and mapped through toStory(); the app chapter + device use real beats.
// A second bar is inserted before story beat 112 (end of the Gen AI chapter): real beats 108–112
// hold the story clock at 112 while the Gen AI chapter keeps running on its own clock (genClock).
// Net length: 148 beats (37 bars = 69.4 s).
const CUT = 44, CUT_LEN = 4, INS = 112, INS_LEN = 4;
const toStory = b => b < CUT ? b : b < INS - CUT_LEN ? b + CUT_LEN : b < INS ? INS : b;
const toReal = sb => sb < CUT ? sb : sb < CUT + CUT_LEN ? CUT : sb < INS ? sb - CUT_LEN : sb;
const genClock = b => b < CUT ? b : b + CUT_LEN; // Gen AI chapter: continuous through the inserted bar
const END = 148;                             // real beats
const DURATION = END * SPB;
const W = 1920, H = 1080;
const C = {pink:'#ff0062',cyan:'#7ce7f9',orange:'#fda602',yellow:'#ffde0b',navy:'#052675',green:'#7cf9bf',purple:'#a97cf9',gold:'#ffc93c',ink:'#0d0d10'};
const STRIPES = [C.pink, C.cyan, C.orange, C.yellow, C.navy];
const IMG = '/media/images/';

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (b, start, dur) => clamp((b - start) / dur);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);
const pulse = (b, k = 6) => b < 0 ? 0 : Math.exp(-frac(b) * k);
const E = {
  o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, o4: x => 1 - (1 - x) ** 4,
  i2: x => x * x, i3: x => x ** 3, i4: x => x ** 4,
  io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  io4: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  oExp: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x),
  iExp: x => x <= 0 ? 0 : 2 ** (10 * x - 10),
  ioExp: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2,
  oBack: (x, s = 1.70158) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
  oEl: x => x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * 2 * Math.PI / 3) + 1,
};

/* ---------- DOM helpers ---------- */
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const px = v => typeof v === 'number' ? v + 'px' : v;
function T(el, o) {
  let t = '';
  if (o.x != null || o.y != null || o.z != null) t += `translate3d(${px(o.x || 0)},${px(o.y || 0)},${px(o.z || 0)})`;
  if (o.rx) t += ` rotateX(${o.rx}deg)`;
  if (o.ry) t += ` rotateY(${o.ry}deg)`;
  if (o.r) t += ` rotate(${o.r}deg)`;
  if (o.s != null) t += ` scale(${o.s})`;
  if (o.sx != null || o.sy != null) t += ` scale(${o.sx ?? 1},${o.sy ?? 1})`;

    size = lerp(5, 2.2, E.oExp(P(b, 140, 2.5)));
    opacity = lerp(1, .5, E.o3(P(b, 141, 3)));
    orbit(-(b - 140) * 1.5, 160);
  }
  mat.size = size; mat.opacity = clamp(opacity);
  renderer.render(scene, camera);
}
