<script>
"use strict";
/* ============================================================
   COWISE IDEA LAB — Custom CMS & Workflow
   Same grammar as intro/index.html: everything is a pure function of
   the playhead (in beats), so the picture is locked to the 128 BPM
   grid and stays scrubbable. Unlike the story film this one runs on a
   single straight beat clock — no cut bars, no holds.

   CHAPTERS (beats · 4 beats = 1 bar = 1.875 s)
     00   0 – 16   intro ............ "Every process starts with a single step."
     01  16 – 36   the content problem
     02  36 – 60   one custom CMS
     03  60 – 84   the workflow: draft → review → approve → publish
     04  84 –104   integrations
     05 104 –124   AI in the loop
     06 124 –136   off-the-shelf vs built around you
     07 136 –160   outro
   ============================================================ */
const BPM = 128, SPB = 60 / BPM;             // 0.46875 s per beat
const END = 160;                             // beats → 75.00 s
const DURATION = END * SPB;
const W = 1920, H = 1080;
const C = {pink:'#ff0062',cyan:'#7ce7f9',orange:'#fda602',yellow:'#ffde0b',navy:'#052675',green:'#7cf9bf',purple:'#a97cf9',gold:'#ffc93c',ink:'#0d0d10'};
const STRIPES = [C.pink, C.cyan, C.orange, C.yellow, C.navy];
const IMG = '/media/images/';
const DROPS = [16, 36, 60, 84, 104, 124, 136, 144];

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (b, start, dur) => clamp((b - start) / dur);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);
const pulse = (b, k = 6) => b < 0 ? 0 : Math.exp(-frac(b) * k);
const E = {
  o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, o4: x => 1 - (1 - x) ** 4,
  i2: x => x * x, i3: x => x ** 3, i4: x => x ** 4,
  io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  io4: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  oExp: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x),
  iExp: x => x <= 0 ? 0 : 2 ** (10 * x - 10),
  ioExp: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2,
  oBack: (x, s = 1.70158) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
  oEl: x => x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * 2 * Math.PI / 3) + 1,

/* "WORKFLOW" drawn in key-visual bars: the glyphs are rasterised once, then each 10px column keeps
   only the vertical runs that fall inside the letters. Each run is two-tone, split by the cover's
   wave — so the word reads purely as a colour change inside the bars. */
let wordRuns = null;
function buildWordRuns(text) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 500; g.font = `500 ${size}px "Barlow Semi Condensed"`;
  const want = W * .82, got = g.measureText(text).width;
  if (got > 0) { size = Math.min(620, size * want / got); g.font = `500 ${size}px "Barlow Semi Condensed"`; }
  g.fillText(text, W / 2, H / 2 + 14);
  const d = g.getImageData(0, 0, W, H).data;
  wordRuns = [];
  for (let i = 0; i < COLS; i++) {
    const x = i * PITCH + 4, runs = []; let y0 = -1;
    for (let y = 0; y <= H; y++) {
      const on = y < H && d[(y * W + x) * 4 + 3] > 127;
      if (on && y0 < 0) y0 = y; else if (!on && y0 >= 0) { runs.push([y0, y]); y0 = -1; }
    }
    // the space around the letters gets bars too; the letters read only by a colour change within each column
    const gaps = []; let y = 0;
    for (const [a, z] of runs) { if (a > y) gaps.push([y, a]); y = z; }
    if (y < H) gaps.push([y, H]);
    wordRuns.push({ runs, gaps });
  }
}
const WB = 60; // the bars spell the word on the chapter-03 drop
function wordBars(ctx, b) {
  if (!wordRuns) buildWordRuns('WORKFLOW');
  // bars shoot up into the letters on the drop, settle back so the type on top reads,
  // breathe on the kick, then lift off the top before the chapter settles
  const alpha = lerp(.72, .4, E.io3(P(b, WB + .5, 1))) * lerp(1, .72, E.io3(P(b, WB + 1.5, .75))) + .06 * pulse(b, 4) * (b < WB + 4 ? 1 : 0);
  for (let i = 0; i < COLS; i++) {
    const { runs, gaps } = wordRuns[i];
    const a = E.oExp(P(b, WB + (i / COLS) * .6 + hash(i) * .2, .7));
    const lift = E.iExp(P(b, WB + 4.1 + (i / COLS) * .4 + hash(i + 5) * .3, .7)) * H * 1.1;
    if (a <= 0 || lift >= H * 1.1) continue;
    const k = ((i - Math.floor((b - WB) * 6)) % COLS + COLS) % COLS;
    ctx.globalAlpha = alpha * (.8 + .2 * Math.sin(i * .12 - b * 3));
    const fill = (segs, col) => {
      ctx.fillStyle = col;
      for (const [y0, y1] of segs) ctx.fillRect(i * PITCH, y1 - (y1 - y0) * a - lift, 9, (y1 - y0) * a);
    };
    fill(gaps, colTop[k]);
    fill(runs, colBot[k]);
  }
  ctx.globalAlpha = 1;
}

      // 0:02 a flat line starts rising (reaches half height at 0:04); from 0:02.5 it morphs into the wave
      // while still rising; 0:04–0:07 the beat dance builds

   type. Additive only: if it fails to load, nothing else changes.
   - intro: dust bursts off the logo fill, then warps past the camera
   - AI chapter: a "latent space" burst drifting behind the type
   - outro: burst on the logo slam, settling into a slow drift
   ============================================================ */
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
const { E, P, clamp, lerp, pulse, hash, STRIPES } = window.__G;
const W = 1920, H = 1080;
const cv = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: 'high-performance', preserveDrawingBuffer: new URLSearchParams(location.search).has('capture') });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1)); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, .5, 3000);

const NP = 2600, pos = new Float32Array(NP * 3), pcol = new Float32Array(NP * 3), col = new THREE.Color();
for (let i = 0; i < NP; i++) {
  const u = hash(i * 1.37) * 2 - 1, th = hash(i * 2.91) * Math.PI * 2, r = 20 + Math.pow(hash(i * 4.13), .6) * 110, s = Math.sqrt(1 - u * u);
  pos.set([Math.cos(th) * s * r, u * r * .62, Math.sin(th) * s * r], i * 3);
  col.set(i % 7 === 0 ? '#ffffff' : STRIPES[i % 5]); pcol.set([col.r, col.g, col.b], i * 3);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(pcol, 3));
const dot = document.createElement('canvas'); dot.width = dot.height = 64;
{ const g = dot.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, '#fff'); gr.addColorStop(.45, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }
const mat = new THREE.PointsMaterial({ size: 2.6, vertexColors: true, map: new THREE.CanvasTexture(dot), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
const points = new THREE.Points(geo, mat); scene.add(points);

function orbit(theta, dist, phi = 6) {
  const t = theta * Math.PI / 180, p = phi * Math.PI / 180;
  camera.position.set(Math.sin(t) * Math.cos(p) * dist, Math.sin(p) * dist, Math.cos(t) * Math.cos(p) * dist);
  camera.lookAt(0, 0, 0);
}
let shown = null;
const vis = on => { if (shown !== on) { cv.style.display = on ? '' : 'none'; shown = on; } };
function burst(b, at, from = .02) { return lerp(from, 1, E.oExp(P(b, at, 2.5))); }
function render(b) {
  const intro = b >= 9.9 && b < 16.2, ai = b >= 103.9 && b < 124, outro = b >= 143.9 && b < 160;
  vis(intro || ai || outro);
  if (!(intro || ai || outro)) return;
  let opacity = 1, size = 2.4;
  if (intro) { // dust bursts as the logo fills, then the camera warps through it with the exit
    const s = burst(b, 10);
    points.scale.setScalar(s * (1 + .03 * pulse(b, 4)));
    points.rotation.set(.15, b * .05, 0);
    const warp = E.iExp(P(b, 14, 2));
    orbit((b - 10) * 2, lerp(170, 6, warp));
    opacity = lerp(.9, .55, E.o3(P(b, 11, 2))) + warp * .45;
    size = lerp(4, 2, E.o3(P(b, 10, 2))) + warp * 2;
  } else if (ai) {
    points.scale.setScalar(burst(b, 104) * (1 + .04 * pulse(b, 4)));
    points.rotation.set(Math.sin(b * .07) * .2, b * .06, 0);
    size = lerp(5, 2.2, E.oExp(P(b, 104, 2.5)));
    opacity = b < 106 ? 1 : lerp(1, .28, E.o3(P(b, 106, 2)));
    orbit((b - 104) * 1.2, 150);
  } else if (outro) { // burst on the logo slam
    points.scale.setScalar(burst(b, 144) * (1 + .03 * pulse(b, 4)));
    points.rotation.set(-.1, -b * .04, 0);
    size = lerp(5, 2.2, E.oExp(P(b, 144, 2.5)));
    opacity = lerp(1, .5, E.o3(P(b, 145, 3)));
    orbit(-(b - 144) * 1.5, 160);
  }
  mat.size = size; mat.opacity = clamp(opacity);
  renderer.render(scene, camera);
}
renderer.compile(scene, camera);
window.__three = { render };
</script>
