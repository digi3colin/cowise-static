<script>
"use strict";
/* ============================================================
   COWISE IDEA LAB — Enterprise
   Same grammar as intro/index.html: everything is a pure function of
   the playhead (in beats), so the picture is locked to the 128 BPM
   grid and stays scrubbable. Like the CMS film this one runs on a
   single straight beat clock — no cut bars, no holds.

   CHAPTERS (beats · 4 beats = 1 bar = 1.875 s)
     00   0 – 16   intro ............ "Every idea starts with a line."
     01  16 – 36   "We started with the web."
     02  36 – 52   "Then came apps."
     03  52 – 72   experience design: easy to engage
     04  72 – 92   the turn: complex software → one clear screen
     05  92 –122   internal web apps built for enterprise teams
     06 122 –146   event systems: RSVP, badge printing, RFID
     07 146 –176   outro
   ============================================================ */
const BPM = 128, SPB = 60 / BPM;             // 0.46875 s per beat
const END = 176;                             // beats → 82.50 s
const DURATION = END * SPB;
const W = 1920, H = 1080;
const C = {pink:'#ff0062',cyan:'#7ce7f9',orange:'#fda602',yellow:'#ffde0b',navy:'#052675',green:'#7cf9bf',purple:'#a97cf9',gold:'#ffc93c',ink:'#0d0d10'};
const STRIPES = [C.pink, C.cyan, C.orange, C.yellow, C.navy];
const IMG = '/media/images/';
const DROPS = [16, 36, 52, 72, 84, 92, 122, 146, 160];

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (b, start, dur) => clamp((b - start) / dur);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);
const pulse = (b, k = 6) => b < 0 ? 0 : Math.exp(-frac(b) * k);
const E = {
  o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, o4: x => 1 - (1 - x) ** 4,
  i2: x => x * x, i3: x => x ** 3, i4: x => x ** 4,
  io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  io4: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  oExp: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x),
  iExp: x => x <= 0 ? 0 : 2 ** (10 * x - 10),

const MONO = 'ui-monospace, Menlo, Consolas, monospace';

  ctx.fillText('–  □  ✕', x + w - 86, y + 25);

  'File Edit View Record Tools Batch Admin Window Help'.split(' ').forEach((t, i) => ctx.fillText(t, x + 14 + i * 72, y + 53));
  // two rows of tiny toolbar buttons
  for (let r = 0; r < 2; r++) for (let i = 0; i < 28; i++) {
    const bx = x + 10 + i * 31, by = y + 64 + r * 29;
    if (bx + 26 > x + w - 10) continue;

    ctx.strokeStyle = '#a7a7a1'; ctx.lineWidth = 1; ctx.strokeRect(bx + .5, by + .5, 25, 25);

  let size = 500; g.font = `500 ${size}px "Barlow Semi Condensed"`;
